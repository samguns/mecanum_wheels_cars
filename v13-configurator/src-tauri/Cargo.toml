[package]
name = "v13-configurator"
version = "0.1.0"
description = "Desktop commissioning and diagnostic tool for V13 motor controllers"
edition = "2021"
rust-version = "1.70"

[lib]
name = "v13_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-serialplugin = "2"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
